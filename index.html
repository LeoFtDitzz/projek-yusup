<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my girlfriend?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Container Utama -->
    <main class="container">
        
        <!-- Badge Atas -->
        <div class="badge">SCENE 4 - FINAL QUESTION</div>

        <!-- Teks Utama -->
        <h1 class="question-text">Will you be my girlfriend?</h1>
        
        <!-- Subtext -->
        <p class="sub-text">Tenang, tombol satu ini tidak akan kabur.</p>

        <!-- Wadah Tombol -->
        <div class="button-wrapper" id="btn-wrapper">
            <!-- Tombol YES (Buka Popup) -->
            <button class="btn yes-btn" id="yes-btn">YES ❤️</button>
            
            <!-- Tombol NO (Kabur) -->
            <button class="btn no-btn" id="no-btn">NO</button>
        </div>

    </main>

    <!-- POPUP KONFIRMASI -->
    <div id="confirm-popup" class="popup-overlay">
        <div class="popup-card">
            <h2>🤔</h2>
            <p class="confirm-text">Beneran yaaa kmu mauu?</p>
            <p class="confirm-sub">Dm akuu plisss...</p>
            
            <!-- Tombol SERIUS -> ke IG -->
            <!-- GANTI USERNAME DI BAWAH INI -->
            <a href="https://instagram.com/justysf" target="_blank" class="btn serius-btn" id="serius-btn">
                SERIUS ❤️
            </a>
            
            <button class="btn cancel-btn" id="cancel-btn">Gabisa</button>
        </div>
    </div>

    <!-- TOMBOL MUSIK (Pojok Kanan Bawah) -->
    <div class="music-controls">
        <button id="music-btn" class="music-btn">
            <span id="music-icon">🔇</span>
        </button>
        <p class="music-label">Klik buat musik 🎵</p>
    </div>

    <!-- Elemen Audio (Hidden) -->
    <!-- GANTI NAMA FILE DI BAWAH INI dengan nama file lagumu -->
    <!-- Contoh: "you_lany.mp3" atau link online -->
    <audio id="bg-music" loop>
        <source src="LANY - you! (official video) - LANYVEVO.mp3" type="audio/mp3">
    </audio>

    <!-- Floating Hearts Background -->
    <div id="floating-hearts-bg"></div>

    <!-- Custom Cursor -->
    <div class="custom-cursor" id="cursor"></div>

    <script src="script.js"></script>
</body>
</html>
